name: Deploy

# Manual, human-approved deploy. Dispatch from the branch you want to deploy
# (GitHub Actions "Use workflow from"); that branch is what gets checked out and
# deployed. The `production` Environment's required-reviewer rule gates the run.
on:
  workflow_dispatch:

permissions:
  id-token: write # OIDC for AWS
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production # requires reviewer approval (configure in repo settings)
    steps:
      - uses: actions/checkout@v6
        # No `ref:` — checkout defaults to the dispatched branch (the one chosen
        # in "Use workflow from"), so the launching branch is what gets deployed.

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install backend deps
        run: npm ci
        working-directory: backend

      - name: Build static frontend
        run: npm ci && npm run build
        working-directory: frontend
        env:
          NEXT_EXPORT: 'true'

      - name: Install infra deps
        run: npm ci
        working-directory: infra

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: CDK deploy
        run: npx cdk deploy --require-approval never
        working-directory: infra
        env:
          CDK_DEFAULT_REGION: ${{ vars.AWS_REGION }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID }}
          # Custom domain (optional). Set these as GitHub Variables once the
          # shared zone + us-east-1 cert exist; see docs/custom-domain.md.
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          CERTIFICATE_ARN: ${{ vars.CERTIFICATE_ARN }}
          HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
          HOSTED_ZONE_NAME: ${{ vars.HOSTED_ZONE_NAME }}
          # WAFv2 web ACL ARN created by CloudFront's one-click protection; must
          # stay attached while the pricing plan is active (else updates 400).
          CLOUDFRONT_WEB_ACL_ARN: ${{ vars.CLOUDFRONT_WEB_ACL_ARN }}
