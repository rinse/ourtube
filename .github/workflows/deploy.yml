name: Deploy

# Manual, human-approved deploy. A human picks the branch/ref and the
# `production` GitHub Environment's required-reviewer rule gates the run.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or ref to deploy'
        required: true
        default: 'main'

permissions:
  id-token: write # OIDC for AWS
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production # requires reviewer approval (configure in repo settings)
    steps:
      - uses: actions/checkout@v4
        with:
          # The branch/ref chosen at workflow_dispatch time.
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend deps
        run: npm ci
        working-directory: backend

      - name: Build static frontend
        run: npm ci && npm run build
        working-directory: frontend
        env:
          NEXT_EXPORT: 'true'

      - name: Install infra deps
        run: npm ci
        working-directory: infra

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: CDK deploy
        run: npx cdk deploy --require-approval never
        working-directory: infra
        env:
          CDK_DEFAULT_REGION: ${{ vars.AWS_REGION }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID }}
          # Custom domain (optional). Set these as GitHub Variables once the
          # shared zone + us-east-1 cert exist; see docs/custom-domain.md.
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          CERTIFICATE_ARN: ${{ vars.CERTIFICATE_ARN }}
          HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
          HOSTED_ZONE_NAME: ${{ vars.HOSTED_ZONE_NAME }}
          # WAFv2 web ACL ARN created by CloudFront's one-click protection; must
          # stay attached while the pricing plan is active (else updates 400).
          CLOUDFRONT_WEB_ACL_ARN: ${{ vars.CLOUDFRONT_WEB_ACL_ARN }}
