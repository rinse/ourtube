name: Deploy

# Auto-deploy with a safety gate. Runs on every push to `main` (e.g. a merged
# PR). App-only changes (backend/frontend) deploy automatically via the
# `production` Environment (no approval). infra/** and workflow changes are
# routed through `production-infra`, which requires a human reviewer. Manual
# `workflow_dispatch` always takes the approval path. See docs/deploy.md.
on:
  push:
    branches: [main]
    # Docs/CI-only pushes never deploy. paths-ignore skips a push only when
    # *every* changed file matches; a push mixing docs with backend code still
    # deploys. `.github/**` is intentionally NOT ignored — workflow changes are
    # treated as infra and gated by the `detect` job below.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

# 同一スタックへのデプロイを直列化する。cancel-in-progress は使わない —
# 進行中の CDK/CloudFormation デプロイを途中で打ち切るとスタックが
# 中途半端な状態（*_IN_PROGRESS）のまま残ってしまうため。
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write # OIDC for AWS
  contents: read

jobs:
  # Decide whether this deploy needs human approval. infra/** or workflow
  # changes → approval (production-infra). Manual dispatch is always treated as
  # infra (safe side): the diff base for paths-filter is ambiguous on dispatch,
  # so we skip the filter there and force the approval path.
  detect:
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.infra == 'true' }}
    steps:
      # paths-filter needs the repo checked out to diff against the pre-push
      # commit on push events. Full history guarantees the merge-base is found.
      - uses: actions/checkout@v6
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            infra:
              - 'infra/**'
              - '.github/workflows/**'

  deploy:
    needs: detect
    runs-on: ubuntu-latest
    # Switch Environment by detect output. `production` = no approval (auto app
    # deploy); `production-infra` = required reviewer (infra/workflow + manual
    # dispatch). Both must exist with the same secrets/variables — see docs.
    environment:
      name: ${{ needs.detect.outputs.infra == 'true' && 'production-infra' || 'production' }}
    steps:
      - uses: actions/checkout@v6
        # No `ref:` — checkout defaults to the triggering ref: the pushed commit
        # on `main` for push events, or the branch chosen in "Use workflow from"
        # for a manual dispatch. Either way that ref is what gets deployed.

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install backend deps
        run: npm ci
        working-directory: backend

      - name: Build static frontend
        run: npm ci && npm run build
        working-directory: frontend
        env:
          NEXT_EXPORT: 'true'

      - name: Install infra deps
        run: npm ci
        working-directory: infra

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: CDK deploy
        # Single stack (VideoplayerStack). --all is harmless and future-proof.
        # WAF was removed; access control is geo restriction + auth + reserved
        # concurrency. See docs/security.md.
        run: npx cdk deploy --all --require-approval never
        working-directory: infra
        env:
          CDK_DEFAULT_REGION: ${{ vars.AWS_REGION }}
          BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID }}
          # CloudFront cert for ourtube.app.esnir.net — a us-east-1 ACM cert,
          # imported by ARN. The app domain and the app.esnir.net hosted zone are
          # platform constants now (the zone id is read from the SSM parameter
          # /esnir/platform/hosted-zone-id). See docs/custom-domain.md.
          CERTIFICATE_ARN: ${{ vars.CERTIFICATE_ARN }}
